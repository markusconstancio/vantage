[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage"
version = "0.1.0"
description = "AI-orchestrated security assessment platform (red-team + OSINT risk)."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
vantage = "vantage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
